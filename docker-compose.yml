name: techstoreai

services:
  web:
    build: .
    image: techstoreai:latest
    container_name: techstoreai
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////app/data/sales.db
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
